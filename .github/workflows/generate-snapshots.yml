name: Generate visual snapshots

on:
  workflow_dispatch:

jobs:
  snapshots:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npx playwright test tests/visual/marketplace.spec.ts --update-snapshots

      - uses: actions/upload-artifact@v4
        with:
          name: visual-snapshots
          path: tests/visual/marketplace.spec.ts-snapshots/
          retention-days: 7
